  /admin/reports/{reportId}:
    patch:
      tags: [Admin]
      operationId: handleReport
      summary: 处理举报（RESOLVED 已处理 / REJECTED 驳回；可附带对账号禁言/封禁）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [RESOLVED, REJECTED]
                note: { type: string, maxLength: 500 }
                discipline:
                  type: object
                  description: >
                    可选：处理举报时对被举报账号执行禁言/封禁。
                    需要用户管理权限且只能处置等级低于自己的账号；RESOLVED 时可用。
                  properties:
                    action:
                      type: string
                      enum: [mute, ban]
                    reason:
                      type: string
                      maxLength: 500
                      description: 处置原因（禁言/封禁文案）
                    durationDays:
                      type: integer
                      minimum: 1
                      maximum: 365
                      description: 时长（天）；缺省 mute=7 天、ban=永久
      responses:
        "200":
          description: 已处理
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

