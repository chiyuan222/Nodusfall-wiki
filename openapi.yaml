openapi: 3.1.0
info:
  title: Nodusfall Wiki API
  version: 1.0.0
  description: 《源初之结》非官方玩家 Wiki、攻略与论坛的后端接口契约。字段以本文件为唯一事实源。
  contact:
    name: Nodusfall Wiki Team
    url: https://github.com/chiyuan222/Nodusfall-wiki
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:4000/v1
    description: 本地开发
  - url: https://api.nodusfall.wiki/v1
    description: 生产环境（占位）
tags:
  - name: System
    description: 健康检查与系统信息
  - name: Users
    description: 用户注册与资料
  - name: Auth
    description: 登录、令牌与会话
  - name: Wiki
    description: Wiki 分类、页面与版本历史
  - name: Guides
    description: 攻略与评分
  - name: Forum
    description: 板块、主题与回复
  - name: Comments
    description: 内容评论与点赞
  - name: Moderation
    description: 内容举报、审核与巡查
  - name: Search
    description: 跨内容搜索
  - name: Uploads
    description: 文件上传与预签名
  - name: Content
    description: 内容驱动的页面 CMS
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /site/sections:
    get:
      tags: [Site]
      operationId: getSiteSections
      summary: 获取内容分区显示开关（禁用的分区前端隐藏/维护中）
      security: []
      responses:
        "200":
          description: 分区开关
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSections"

  /admin/site/sections:
    put:
      tags: [Site]
      operationId: updateSiteSections
      summary: 更新内容分区显示开关（仅站长或具备内容管理 manage_content 的管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/UpdateSiteSectionsRequest"
      responses:
        "200":
          description: 更新后的分区开关
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSections"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /site/floating-windows:
    get:
      tags: [Site]
      operationId: getFloatingWindows
      summary: 获取论坛页左右漂浮引流窗配置
      security: []
      responses:
        "200":
          description: 漂浮窗配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingWindows"

  /admin/site/floating-windows:
    put:
      tags: [Site]
      operationId: updateFloatingWindows
      summary: 更新论坛页左右漂浮引流窗（仅站长或具备内容管理 manage_content 的管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/UpdateFloatingWindowsRequest"
      responses:
        "200":
          description: 更新后的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingWindows"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /site/appearance:
    get:
      tags: [Site]
      operationId: getSiteAppearance
      summary: 获取全站标题外观配置（颜色/字体族/字重；null 表示跟随主题默认）
      security: []
      responses:
        "200":
          description: 标题外观配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppearanceConfig"

  /admin/site/appearance:
    put:
      tags: [Site]
      operationId: updateSiteAppearance
      summary: 更新全站标题外观配置（仅站长或具备内容管理 manage_content 的管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/UpdateAppearanceRequest"
      responses:
        "200":
          description: 更新后的标题外观配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppearanceConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /home/digest:
    get:
      tags: [Content]
      operationId: getHomeDigest
      summary: 首页最新动态与精华推荐聚合
      security: []
      parameters:
        - name: latestLimit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
        - name: featuredLimit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: 首页聚合数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeDigestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /content/pages/{slug}:
    get:
      tags: [Content]
      operationId: getContentPage
      summary: 获取页面内容（home / world）
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [home, world]
      responses:
        "200":
          description: 页面内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/content/pages/{slug}:
    put:
      tags: [Content]
      operationId: putContentPage
      summary: 保存页面内容（管理员写）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [home, world]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentPageWrite"
      responses:
        "200":
          description: 保存后的页面内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    post:
      tags: [Users]
      operationId: registerUser
      summary: 注册用户
      security: []
      requestBody:
        $ref: "#/components/requestBodies/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 获取当前用户资料
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: 更新当前用户资料
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/UpdateCurrentUserRequest"
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      operationId: deleteCurrentUser
      summary: 注销当前账号（软注销，需密码确认；内容保留并匿名化，会话全部失效）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          description: 已注销
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/phone:
    post:
      tags: [Users]
      operationId: bindPhone
      summary: 绑定或换绑手机号（无手机号=绑定，有手机号=换绑；成功后认证组 verified）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, smsCode]
              properties:
                phone:
                  type: string
                  pattern: "^1[3-9]\\d{9}$"
                  description: 新手机号
                smsCode:
                  type: string
                  description: 短信验证码（POST /auth/sms-codes 获取，6 位数字，10 分钟内有效）
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 手机号已被其他账号绑定

  /users/me/threads:
    get:
      tags: [Users]
      operationId: listMyThreads
      summary: 我发布的主题
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 我的主题列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/bookmarks:
    get:
      tags: [Users]
      operationId: listMyBookmarks
      summary: 我收藏的主题
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 我的收藏列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/comments:
    get:
      tags: [Users]
      operationId: listMyComments
      summary: 我的评论列表
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 我的评论列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCommentList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/history:
    get:
      tags: [Users]
      operationId: listMyHistory
      summary: 我的浏览记录（仅登录用户，按最近浏览倒序）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 浏览记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      operationId: createHistoryEntry
      summary: 记录一次浏览（详情页挂载时上报一次）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/CreateHistoryEntryRequest"
      responses:
        "201":
          description: 已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      operationId: clearMyHistory
      summary: 清空我的浏览记录
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: 已清空
        "401":
          $ref: "#/components/responses/Unauthorized"

  /feedback:
    post:
      tags: [Feedback]
      operationId: createFeedback
      summary: 提交意见反馈（问题反馈/功能建议/内容申诉/其他）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/CreateFeedbackRequest"
      responses:
        "201":
          description: 提交成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FeedbackItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /users/me/feedback:
    get:
      tags: [Feedback]
      operationId: listMyFeedback
      summary: 我的反馈记录（含站长回复，分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 反馈列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/messages:
    get:
      tags: [Users]
      operationId: listMyMessages
      summary: 我的消息（私信 + 全站公告，按时间倒序，分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      operationId: sendDirectMessage
      summary: 发送私信（仅站长与注册用户之间；普通用户间/管理员间禁止）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/CreateDirectMessageRequest"
      responses:
        "201":
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/messages/unread-count:
    get:
      tags: [Users]
      operationId: getMyUnreadCount
      summary: 未读消息数（头像红点）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 未读数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/checkin:
    get:
      tags: [Users]
      operationId: getCheckInStatus
      summary: 今日签到状态与连续签到天数
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 签到状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      operationId: checkIn
      summary: 每日签到（+10 经验，连续 7 天额外 +30；重复签到 409）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 签到成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me/exp-log:
    get:
      tags: [Users]
      operationId: listExpLog
      summary: 我的经验记录（来源/数值/时间，分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 经验记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/messages/read-all:
    post:
      tags: [Users]
      operationId: markAllMessagesRead
      summary: 全部消息标记已读（进入消息页后调用，红点消除）
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: 已全部标记
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/feedback:
    get:
      tags: [Admin]
      operationId: listAdminFeedback
      summary: 反馈队列（站长专属；管理员不显示）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, REPLIED, CLOSED] }
      responses:
        "200":
          description: 反馈列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/feedback/{feedbackId}:
    patch:
      tags: [Admin]
      operationId: handleFeedback
      summary: 回复/关闭反馈（仅站长；回复后站内信通知提交人）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [REPLIED, CLOSED]
                replyText:
                  type: string
                  maxLength: 1000
                  description: REPLIED 时必填，作为站内信回复内容
      responses:
        "200":
          description: 处理结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FeedbackItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/announcements:
    get:
      tags: [Users]
      operationId: listMyAnnouncements
      summary: 我的公告（分页，含已读状态）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 公告列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/announcements/read-all:
    post:
      tags: [Users]
      operationId: markAnnouncementsRead
      summary: 公告全部标记已读（进入公告页后调用）
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: 已标记
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/conversations:
    get:
      tags: [Users]
      operationId: listConversations
      summary: 私信会话列表（按最后消息时间倒序，含对方摘要/未读数/最后消息）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/conversations/{peerId}:
    get:
      tags: [Users]
      operationId: listConversationMessages
      summary: 与指定用户的私信记录（时间倒序分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: peerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 私信列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Users]
      operationId: sendConversationMessage
      summary: 发送私信（普通用户仅可发给站长；站长可主动私信任意用户；禁止发给本人）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "201":
          description: 发送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DirectMessageItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/conversations/{peerId}/read:
    post:
      tags: [Users]
      operationId: markConversationRead
      summary: 将该会话中对方发来的消息全部标记已读
      security: [{ bearerAuth: [] }]
      parameters:
        - name: peerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: 已标记
