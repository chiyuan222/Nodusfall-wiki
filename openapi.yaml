        id: { type: string, format: uuid }
        kind: { type: string, enum: [wiki, guide, forum] }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: [string, "null"] }
        coverImage: { type: [string, "null"], format: uri }
        author:
          $ref: "#/components/schemas/UserSummary"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        boardSlug: { type: [string, "null"] }
        stats:
          $ref: "#/components/schemas/DigestStats"
        likedByMe: { type: [boolean, "null"] }
        bookmarkedByMe: { type: [boolean, "null"] }
        myScore: { type: [integer, "null"] }

    HomeDigestResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [latest, featured]
          properties:
            latest:
              type: array
              items: { $ref: "#/components/schemas/DigestItem" }
            featured:
              type: array
              items: { $ref: "#/components/schemas/DigestItem" }

  responses:
    ValidationError:
      description: 请求校验失败
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "https://api.nodusfall.example.com/errors/validation-error"
            title: "Validation Error"
            status: 400
            detail: "请求参数校验失败"
            code: "VALIDATION_ERROR"
            requestId: "req_01J0ABCDEF"
            errors:
              - field: "email"
                code: "INVALID_FORMAT"
                message: "email 必须是有效的邮箱地址"
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "https://api.nodusfall.example.com/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            code: "UNAUTHENTICATED"
    Forbidden:
      description: 权限不足
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "https://api.nodusfall.example.com/errors/forbidden"
            title: "Forbidden"
            status: 403
            code: "FORBIDDEN"
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "https://api.nodusfall.example.com/errors/not-found"
            title: "Not Found"
            status: 404
            code: "NOT_FOUND"
    Conflict:
      description: 资源冲突
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "https://api.nodusfall.example.com/errors/conflict"
            title: "Conflict"
            status: 409
            code: "CONFLICT"
    RateLimited:
      description: 触发限流
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "https://api.nodusfall.example.com/errors/rate-limited"
            title: "Too Many Requests"
            status: 429
            code: "RATE_LIMITED"
