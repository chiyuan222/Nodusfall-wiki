  /reports:
    post:
      tags: [Moderation]
      operationId: createReport
      summary: 举报内容或用户（论坛主题/回复/评论/Wiki/攻略/用户）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType:
                  type: string
                  enum: [forumThread, forumPost, comment, wikiPage, guide, user]
                targetId:
                  type: string
                  description: 内容 id/slug；targetType 为 user 时传用户 uuid
                reason:
                  type: string
                  enum: [spam, porn, politics, violence, illegal, other]
                detail:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: 举报已提交
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
