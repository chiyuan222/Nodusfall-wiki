            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: 文件过大
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /uploads/presign:
    post:
      tags: [Uploads]
      operationId: presignUpload
      summary: 获取预签名上传地址
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/PresignUploadRequest"
      responses:
        "201":
          description: 预签名信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUpload"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  requestBodies:
    AdminWikiCategoryCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, name, sortOrder]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminWikiCategoryUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminGuideCategoryCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, name, sortOrder]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminGuideCategoryUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminForumBoardCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, name, sortOrder]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminForumBoardUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    RegisterRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username:
                type: string
                minLength: 2
                maxLength: 32
                pattern: "^[\\w\\-\\u4e00-\\u9fa5]+$"
              password:
                type: string
                minLength: 8
                maxLength: 128
              email:
                type: string
                format: email
                description: 邮箱注册时必填，需同时传 emailCode
              emailCode:
                type: string
                description: 邮箱注册验证码（POST /auth/email-codes 获取，6 位数字，10 分钟内有效）
              phone:
                type: string
                pattern: "^1[3-9]\\d{9}$"
                description: 中国大陆手机号注册（需同时传 smsCode 短信验证码；与 email 二选一）
              smsCode:
                type: string
                description: 手机号注册验证码（POST /auth/sms-codes 获取，6 位数字，10 分钟内有效）
    AuthSessionRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [grantType]
            properties:
              grantType:
                type: string
                enum: [password, refreshToken]
              email:
                type: string
                format: email
                description: 邮箱登录（与 phone 二选一）
              phone:
                type: string
                pattern: "^1[3-9]\\d{9}$"
                description: 手机号登录（与 email 二选一）
              password:
                type: string
              refreshToken:
                type: string
    UpdateCurrentUserRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              displayName:
                type: string
                maxLength: 64
              avatarUrl:
                type: string
                format: uri
              bio:
                type: string
              privacy:
                type: object
                description: 公开主页各内容分区对外可见性（部分更新，仅传需要修改的字段即可）
                properties:
                  showThreads:
                    type: boolean
                    description: 对外展示我发布的主题
                  showComments:
                    type: boolean
                    description: 对外展示我的评论
                  showBookmarks:
                    type: boolean
                    description: 对外展示我的收藏
    CreateHistoryEntryRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, slug]
            properties:
              kind:
                type: string
                enum: [wikiPage, guide, forumThread]
              slug:
                type: string
                description: wiki/guide 的 slug；forumThread 传 threadId
    CreateDirectMessageRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [recipientId, content]
            properties:
              recipientId: { type: string, format: uuid }
              content: { type: string, maxLength: 2000 }
    CreateFeedbackRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [category, content]
            properties:
              category:
                type: string
                enum: [bug, suggestion, appeal, other]
              content:
                type: string
                minLength: 2
                maxLength: 1000
    CreateAnnouncementRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content]
            properties:
              title: { type: string, maxLength: 200 }
              content: { type: string, maxLength: 5000 }
    CreateVideoRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, title, url]
            properties:
              kind:
                type: string
                enum: [official, analysis, gameplay]
              title: { type: string, maxLength: 200 }
              url: { type: string, format: uri }
              platform:
                type: string
                enum: [bilibili, douyin, youtube, other]
              coverImage: { type: [string, "null"], format: uri }
              description: { type: [string, "null"], maxLength: 500 }
              published: { type: boolean }
              sortOrder: { type: integer }
    CreateVideoShareRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, title, url]
            properties:
              kind:
                type: string
                enum: [official, analysis, gameplay]
              title: { type: string, maxLength: 200 }
              url: { type: string, format: uri }
              platform:
                type: string
                enum: [bilibili, douyin, youtube, other]
              coverImage: { type: [string, "null"], format: uri }
              description: { type: [string, "null"], maxLength: 500 }
    UpdateVideoShareRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              kind:
                type: string
                enum: [official, analysis, gameplay]
              title: { type: string, maxLength: 200 }
              url: { type: string, format: uri }
              platform:
                type: string
                enum: [bilibili, douyin, youtube, other]
              coverImage: { type: [string, "null"], format: uri }
              description: { type: [string, "null"], maxLength: 500 }
    UpdateSiteSectionsRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              home: { type: boolean }
              world: { type: boolean }
              wiki: { type: boolean }
              guides: { type: boolean }
              forum: { type: boolean }
              videos: { type: boolean }
    UpdateFloatingWindowsRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              left:
                $ref: "#/components/schemas/FloatingWindowConfig"
              right:
                $ref: "#/components/schemas/FloatingWindowConfig"
    UpdateAppearanceRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAppearance"
    UpdateVideoRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              kind:
                type: string
                enum: [official, analysis, gameplay]
              title: { type: string, maxLength: 200 }
              url: { type: string, format: uri }
              platform:
                type: string
                enum: [bilibili, douyin, youtube, other]
              coverImage: { type: [string, "null"], format: uri }
              description: { type: [string, "null"], maxLength: 500 }
              published: { type: boolean }
              sortOrder: { type: integer }
    AdminUpdateUserRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              group:
                type: string
                enum: [normal, verified, premium]
              level:
                type: integer
                minimum: 1
                maximum: 10
              status:
                type: string
                enum: [active, muted, banned]
              banReason: { type: string }
              banUntil: { type: [string, "null"], format: date-time }
              mutedUntil: { type: [string, "null"], format: date-time }
              wikiCreateGranted: { type: boolean }
              guideCreateGranted: { type: boolean }
              videoShareGranted: { type: boolean }
              permissions:
                type: array
                items:
                  type: string
                enum: [manage_users, manage_content, manage_all_boards, manage_wiki_board, manage_guide_board, manage_forum_board, manage_video_board, manage_reports, grant_wiki_create, grant_guide_create, grant_video_share]
              role:
                type: string
                enum: [member, wiki_editor, guide_editor, video_editor, wiki_moderator, guide_moderator, forum_moderator, video_moderator, admin]
                description: 角色分配（不含 owner）：站长→管理员→各分区版主→各分区小编/成员；管理员可分配版主/小编/成员，细分版主仅可把成员分配为对应分区小编；站长自身固定为站长不可被分配
                maxLength: 500
    CreateWikiPageRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content, categorySlug]
            properties:
              title:
                type: string
                maxLength: 200
              slug:
                type: string
                pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              categorySlug:
                type: string
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              content:
                type: string
              status:
                type: string
                enum: [draft, published]
                default: draft
              changelog:
                type: string
                maxLength: 200
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    UpdateWikiPageRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              categorySlug: { type: string }
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              content: { type: string }
              status:
                type: string
                enum: [draft, published, archived]
              changelog:
                type: string
                maxLength: 200
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    CreateGuideRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content]
            properties:
              title: { type: string, maxLength: 200 }
              slug:
                type: string
                pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              content: { type: string }
              categorySlug:
                type: string
                pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                description: 攻略分类 slug（可选；缺省归默认分类）
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              status:
                type: string
                enum: [draft, published]
                default: draft
              relatedCharacter:
                type: string
    UpdateGuideRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              categorySlug:
                type: string
                pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              status:
                type: string
                enum: [draft, published, archived]
              relatedCharacter: { type: string }
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    RatingInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [score]
            properties:
              score:
                type: integer
                minimum: 1
                maximum: 5
    CreateForumThreadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content]
            properties:
              title: { type: string, maxLength: 120 }
              content: { type: string, maxLength: 20000 }
              coverImage: { type: [string, "null"], format: uri }
    UpdateForumThreadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string, maxLength: 120 }
              pinned: { type: boolean }
              locked: { type: boolean }
              coverImage: { type: [string, "null"], format: uri }
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    CreateForumPostRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string, maxLength: 20000 }
    CreateCommentRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string, maxLength: 2000 }
    PresignUploadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [filename, contentType]
            properties:
              filename: { type: string }
              contentType: { type: string }
              size:
                type: integer
                maximum: 10485760

  schemas:
    Error:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: "https://api.nodusfall.example.com/errors/validation-error"
        title:
          type: string
          example: "Validation Error"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "请求参数校验失败"
        instance:
          type: string
          format: uri
        code:
          type: string
          example: "VALIDATION_ERROR"
        requestId:
          type: string
          example: "req_01J0ABCDEF"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: "email"
        code:
          type: string
          example: "INVALID_FORMAT"
        message:
          type: string
          example: "email 必须是有效的邮箱地址"

    Pagination:
      type: object
      required: [page, perPage, total, totalPages, hasMore]
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        total:
          type: integer
          example: 128
        totalPages:
          type: integer
          example: 7
        hasMore:
          type: boolean
          example: true

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: "1.0.0"
        dependencies:
          type: object
          additionalProperties:
            type: string

    SiteSections:
      type: object
      required: [home, world, wiki, guides, forum, videos]
      properties:
        home: { type: boolean }
        world: { type: boolean }
        wiki: { type: boolean }
        guides: { type: boolean }
        forum: { type: boolean }
        videos: { type: boolean }

    FloatingWindowConfig:
      type: object
      required: [enabled, imageUrl, linkUrl]
      properties:
        enabled: { type: boolean }
        imageUrl: { type: [string, "null"], format: uri }
        linkUrl: { type: [string, "null"], format: uri }

    FloatingWindows:
      type: object
      required: [left, right]
      properties:
        left: { $ref: "#/components/schemas/FloatingWindowConfig" }
        right: { $ref: "#/components/schemas/FloatingWindowConfig" }

    AppearanceHeading:
      type: object
      required: [color, fontFamily, fontWeight]
      description: 标题外观设置；null 表示跟随站点主题默认，不注入覆盖样式
      properties:
        color:
          type: string
          nullable: true
          pattern: "^#[0-9a-fA-F]{6}$"
          description: 标题颜色（#RRGGBB），调色盘取色
        fontFamily:
          type: string
          nullable: true
          enum: [serif, sans, kaiti]
          description: 标题字体族预设 key（serif=衬线宋体系默认 / sans=无衬线黑体系 / kaiti=楷体系），由前端映射为 CSS font-family 栈
        fontWeight:
          type: integer
          nullable: true
          enum: [400, 500, 600, 700, 800]
          description: 标题字重

    AppearanceConfig:
      type: object
      required: [heading]
      properties:
        heading: { $ref: "#/components/schemas/AppearanceHeading" }

    UpdateAppearance:
      type: object
      description: 部分更新语义：未传字段保持原值；传 null 恢复主题默认
      properties:
        heading:
          type: object
          properties:
            color:
              type: string
              nullable: true
              pattern: "^#[0-9a-fA-F]{6}$"
            fontFamily:
              type: string
              nullable: true
              enum: [serif, sans, kaiti]
            fontWeight:
              type: integer
              nullable: true
              enum: [400, 500, 600, 700, 800]

    UserSummary:
      type: object
      required: [id, siteId, username, displayName, role, createdAt, status, group, level]
      properties:
        id: { type: string, format: uuid }
        siteId:
          type: integer
          minimum: 1000000
          description: 全站唯一 7 位网站 ID，注册时按顺序分配（1000000 起），注销不复用
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        role:
          type: string
          enum: [member, wiki_editor, guide_editor, video_editor, wiki_moderator, guide_moderator, forum_moderator, video_moderator, admin, owner]
          description: >
            owner 站长（唯一、全站最高权限）；admin 管理员（自动开启除角色分配外全部管理与创作权限）；
            *moderator 分区版主（自动开启对应分区板块管理 + 举报 + 用户管理，可处置低等级账号）；
            *editor 分区小编（对应分区板块内容下架/恢复，无账号处置）；member 成员。
            角色分配层级：站长→管理员→各分区版主→各分区小编/成员；论坛未开放前 forum 相关能力置灰。
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [active, muted, banned, deleted]
          description: muted 禁言（可浏览不可发言）；banned 黑名单（禁止登录访问）；deleted 已注销
        group:
          type: string
          enum: [normal, verified, premium]
          description: normal 仅阅览；verified 认证后可评论/发帖；premium 付费组（预留）
        level:
          type: integer
          minimum: 1
          maximum: 10
          description: 通用用户等级 1-10

    ProfilePrivacy:
      type: object
      required: [showThreads, showComments, showBookmarks]
      description: 公开主页各内容分区的对外可见性（默认全部开启，与现有行为一致）
      properties:
        showThreads:
          type: boolean
          default: true
          description: 对外展示我发布的主题
        showComments:
          type: boolean
          default: true
          description: 对外展示我的评论
        showBookmarks:
          type: boolean
          default: true
          description: 对外展示我的收藏

    PublicUserProfile:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          description: >
            用户公开主页资料。仅包含对外展示字段（头像/显示名/用户名/UID(siteId)/等级/简介/注册时间等），
            严格不返回 email、emailMasked、phone、phoneMasked、permissions、banReason 等私有或管理字段，
            也不返回“打码后”的邮箱/手机列——这些字段在公开响应中直接不存在。
            banned/deleted 用户不对外展示（GET /users/{userId} 返回 404）；muted 用户可浏览但仅只读。
          properties:
            bio: { type: [string, "null"], description: 个人简介，未填写为 null }
            updatedAt: { type: string, format: date-time }
            privacy:
              $ref: "#/components/schemas/ProfilePrivacy"

    User:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            bio: { type: string }
            privacy:
              $ref: "#/components/schemas/ProfilePrivacy"
            updatedAt: { type: string, format: date-time }
            emailMasked: { type: string }
            phoneMasked: { type: [string, "null"] }
            exp:
              type: integer
              description: 累计经验（等级由经验换算）
            nextLevelExp:
              type: [integer, "null"]
              description: 升到下一级所需累计经验；满级为 null
            permissions:
              type: array
              items:
                type: string
                enum: [manage_users, manage_content, manage_all_boards, manage_wiki_board, manage_guide_board, manage_forum_board, manage_video_board, manage_reports, grant_wiki_create, grant_guide_create, grant_video_share]
              description: 管理权限开关（仅 owner 可配置；admin 角色自动全开；细分版主/小编按角色自动映射，开关可在角色默认上由站长增减）
            wikiCreateGranted:
              type: boolean
              description: 是否被授予 Wiki 词条创建资格（仅解锁 Wiki 创建）
            guideCreateGranted:
              type: boolean
              description: 是否被授予编撰攻略资格（仅解锁攻略创建）
            videoShareGranted:
              type: boolean
              description: 是否被授予视频分享资格（仅解锁相关视频区新增条目）
            banReason: { type: [string, "null"] }
            banUntil: { type: [string, "null"], format: date-time }
            mutedUntil: { type: [string, "null"], format: date-time }

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [email, phone, lastActiveAt]
          properties:
            email: { type: string, format: email }
            phone: { type: [string, "null"] }
            lastActiveAt: { type: [string, "null"], format: date-time }

    AdminUserList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AdminStatsDay:
      type: object
      required: [date, pv, uv, dau]
      properties:
        date: { type: string, format: date }
        pv: { type: integer }
        uv: { type: integer }
        dau: { type: integer }

    AdminStatsOverview:
      type: object
      required: [users, today, yesterday, weekly, monthly, online, topContents]
      properties:
        users:
          type: object
          required: [total, todayNew]
          properties:
            total: { type: integer }
            todayNew: { type: integer }
        today:
          $ref: "#/components/schemas/AdminStatsDay"
        yesterday:
          $ref: "#/components/schemas/AdminStatsDay"
        weekly:
          type: array
          items:
            $ref: "#/components/schemas/AdminStatsDay"
        monthly:
          type: object
          required: [mau]
          properties:
            mau: { type: integer }
        online: { type: integer, description: 最近 15 分钟活跃登录用户数 }
        topContents:
          type: array
          maxItems: 10
          items:
            type: object
            required: [kind, slug, title, views]
            properties:
              kind:
                type: string
                enum: [wikiPage, guide, forumThread]
              slug: { type: string }
              title: { type: string }
              views: { type: integer }

    AuditLog:
      type: object
      required: [id, action, actorName, createdAt]
      properties:
        id: { type: string, format: uuid }
        action:
          type: string
          description: >
            动作类型：site.sections.update / site.floating.update /
            cms.page.update / announcement.create / user.update /
            wiki.category.create|update|delete / forum.board.create|update|delete /
            video.create|update|delete / wiki.page.update|delete / guide.update|delete /
            forum.thread.update|delete / forum.post.update|delete / comment.delete
        targetType: { type: string, nullable: true, description: 目标对象类型（如 wikiCategory / forumBoard / user） }
        targetId: { type: string, nullable: true, description: 目标对象 id 或 slug }
        detail: { type: string, nullable: true, description: 人类可读的动作描述 }
        actorName: { type: string, description: 操作者用户名快照（账号注销后仍保留） }
        actor:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        createdAt: { type: string, format: date-time }

    AuditLogList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Report:
      type: object
      required: [id, targetType, targetId, reason, status, createdAt, reporter]
      properties:
        id: { type: string, format: uuid }
        targetType:
          type: string
          enum: [forumThread, forumPost, comment, wikiPage, guide, user]
        targetId: { type: string }
        targetUser:
          nullable: true
          description: 被举报用户摘要；仅 targetType=user 时回填，其余为 null
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        reason:
          type: string
          enum: [spam, porn, politics, violence, illegal, other]
        detail: { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, RESOLVED, REJECTED]
        note: { type: string, nullable: true, description: 处理备注 }
        reporter:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        handledBy:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        handledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ReportList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ModerationContentItem:
      type: object
      required: [id, type, title, excerpt, author, createdAt, status]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [forumThread, forumPost, comment, wikiPage, guide]
        title: { type: string, description: 主题/标题；回复/评论为空串 }
        excerpt: { type: string, description: 内容前 120 字纯文本 }
        author:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"
        status:
          type: string
          description: 内容状态（published/deleted 等，按类型）
        createdAt: { type: string, format: date-time }

    ModerationContentList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModerationContentItem"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AuthSession:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, sessionId, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          example: 900
        sessionId: { type: string, format: uuid }
        user:
          $ref: "#/components/schemas/User"

    WikiCategory:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    WikiCategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WikiCategory"

    GuideCategory:
      type: object
      required: [id, slug, name, sortOrder]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    GuideCategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GuideCategory"

    WikiPageSummary:
      type: object
      required: [id, slug, title, excerpt, coverImage, categorySlug, tags, status, author, updatedAt, viewCount, likeCount, likedByMe, bookmarkedByMe, dislikeCount, dislikedByMe]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        coverImage: { type: [string, "null"], format: uri }
        categorySlug: { type: string }
        tags:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [draft, published, archived]
        author:
          $ref: "#/components/schemas/UserSummary"
        updatedAt: { type: string, format: date-time }
        viewCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        bookmarkedByMe: { type: boolean }
        dislikeCount: { type: integer, description: 「不推荐/内容有误」标记数 }
        dislikedByMe: { type: boolean, description: 当前登录用户是否已标记（匿名 false） }

    WikiPage:
      allOf:
        - $ref: "#/components/schemas/WikiPageSummary"
        - type: object
          required: [content, version, createdAt, revisionCount, featuredAt]
          properties:
            content: { type: string }
            version: { type: integer }
            createdAt: { type: string, format: date-time }
            revisionCount: { type: integer }
            featuredAt: { type: [string, "null"], format: date-time }

    WikiPageList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WikiPageSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    WikiPageRevision:
      type: object
      required: [id, pageId, version, title, content, changelog, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        pageId: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string }
        content: { type: string }
        changelog: { type: string }
        author:
          $ref: "#/components/schemas/UserSummary"
        createdAt: { type: string, format: date-time }

    WikiPageRevisionList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WikiPageRevision"
        pagination:
          $ref: "#/components/schemas/Pagination"

    GuideSummary:
      type: object
      required: [id, slug, title, excerpt, coverImage, categorySlug, tags, status, author, rating, updatedAt, viewCount, likeCount, likedByMe, bookmarkedByMe, dislikeCount, dislikedByMe]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        coverImage: { type: [string, "null"], format: uri }
        categorySlug: { type: [string, "null"], description: 攻略分类 slug（未分类为 null） }
        tags:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [draft, published, archived]
        author:
          $ref: "#/components/schemas/UserSummary"
        rating:
          type: number
          minimum: 0
          maximum: 5
        ratingCount:
          type: integer
        updatedAt: { type: string, format: date-time }
        viewCount: { type: integer }
        likeCount: { type: integer }
        likedByMe: { type: boolean }
        bookmarkedByMe: { type: boolean }
        dislikeCount: { type: integer, description: 「不推荐/内容有误」标记数 }
        dislikedByMe: { type: boolean, description: 当前登录用户是否已标记（匿名 false） }

    Guide:
      allOf:
        - $ref: "#/components/schemas/GuideSummary"
        - type: object
          required: [content, createdAt, featuredAt]
          properties:
            content: { type: string }
            relatedCharacter: { type: string }
            createdAt: { type: string, format: date-time }
            featuredAt: { type: [string, "null"], format: date-time }

    GuideList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GuideSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    VideoEntry:
      type: object
      required: [id, kind, title, url, platform, coverImage, description, published, sortOrder, createdAt, updatedAt, author]
      properties:
        id: { type: string, format: uuid }
        author:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          description: 分享者（管理端条目/未关联作者为 null）
        kind:
          type: string
