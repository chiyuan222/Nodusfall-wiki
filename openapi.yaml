openapi: 3.1.0
info:
  title: Nodusfall Wiki API
  version: 1.0.0
  description: 《源初之结》非官方玩家 Wiki、攻略与论坛的后端接口契约。字段以本文件为唯一事实源。
  contact:
    name: Nodusfall Wiki Team
    url: https://github.com/chiyuan222/Nodusfall-wiki
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:4000/v1
    description: 本地开发
  - url: https://api.nodusfall.wiki/v1
    description: 生产环境（占位）
tags:
  - name: System
    description: 健康检查与系统信息
  - name: Users
    description: 用户注册与资料
  - name: Auth
    description: 登录、令牌与会话
  - name: Wiki
    description: Wiki 分类、页面与版本历史
  - name: Guides
    description: 攻略与评分
  - name: Forum
    description: 板块、主题与回复
  - name: Comments
    description: 内容评论与点赞
  - name: Search
    description: 跨内容搜索
  - name: Uploads
    description: 文件上传与预签名
  - name: Content
    description: 内容驱动的页面 CMS
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /site/sections:
    get:
      tags: [Site]
      operationId: getSiteSections
      summary: 获取内容分区显示开关（禁用的分区前端隐藏/维护中）
      security: []
      responses:
        "200":
          description: 分区开关
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSections"

  /admin/site/sections:
    put:
      tags: [Site]
      operationId: updateSiteSections
      summary: 更新内容分区显示开关（仅站长或具备 manage_cms 的管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/UpdateSiteSectionsRequest"
      responses:
        "200":
          description: 更新后的分区开关
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSections"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /site/floating-windows:
    get:
      tags: [Site]
      operationId: getFloatingWindows
      summary: 获取论坛页左右漂浮引流窗配置
      security: []
      responses:
        "200":
          description: 漂浮窗配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingWindows"

  /admin/site/floating-windows:
    put:
      tags: [Site]
      operationId: updateFloatingWindows
      summary: 更新论坛页左右漂浮引流窗（仅站长或具备 manage_cms 的管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/UpdateFloatingWindowsRequest"
      responses:
        "200":
          description: 更新后的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingWindows"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /home/digest:
    get:
      tags: [Content]
      operationId: getHomeDigest
      summary: 首页最新动态与精华推荐聚合
      security: []
      parameters:
        - name: latestLimit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
        - name: featuredLimit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        "200":
          description: 首页聚合数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeDigestResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /content/pages/{slug}:
    get:
      tags: [Content]
      operationId: getContentPage
      summary: 获取页面内容（home / world）
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [home, world]
      responses:
        "200":
          description: 页面内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/content/pages/{slug}:
    put:
      tags: [Content]
      operationId: putContentPage
      summary: 保存页面内容（管理员写）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [home, world]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentPageWrite"
      responses:
        "200":
          description: 保存后的页面内容
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    post:
      tags: [Users]
      operationId: registerUser
      summary: 注册用户
      security: []
      requestBody:
        $ref: "#/components/requestBodies/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 获取当前用户资料
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: 更新当前用户资料
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/UpdateCurrentUserRequest"
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      operationId: deleteCurrentUser
      summary: 注销当前账号（软注销，需密码确认；内容保留并匿名化，会话全部失效）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          description: 已注销
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/threads:
    get:
      tags: [Users]
      operationId: listMyThreads
      summary: 我发布的主题
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 我的主题列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/bookmarks:
    get:
      tags: [Users]
      operationId: listMyBookmarks
      summary: 我收藏的主题
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 我的收藏列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/comments:
    get:
      tags: [Users]
      operationId: listMyComments
      summary: 我的评论列表
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 我的评论列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCommentList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/history:
    get:
      tags: [Users]
      operationId: listMyHistory
      summary: 我的浏览记录（仅登录用户，按最近浏览倒序）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 浏览记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      operationId: createHistoryEntry
      summary: 记录一次浏览（详情页挂载时上报一次）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/CreateHistoryEntryRequest"
      responses:
        "201":
          description: 已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      operationId: clearMyHistory
      summary: 清空我的浏览记录
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: 已清空
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/messages:
    get:
      tags: [Users]
      operationId: listMyMessages
      summary: 我的消息（私信 + 全站公告，按时间倒序，分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      operationId: sendDirectMessage
      summary: 发送私信（仅站长与注册用户之间；普通用户间/管理员间禁止）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/CreateDirectMessageRequest"
      responses:
        "201":
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/messages/unread-count:
    get:
      tags: [Users]
      operationId: getMyUnreadCount
      summary: 未读消息数（头像红点）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 未读数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/checkin:
    get:
      tags: [Users]
      operationId: getCheckInStatus
      summary: 今日签到状态与连续签到天数
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 签到状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      operationId: checkIn
      summary: 每日签到（+10 经验，连续 7 天额外 +30；重复签到 409）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 签到成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me/exp-log:
    get:
      tags: [Users]
      operationId: listExpLog
      summary: 我的经验记录（来源/数值/时间，分页）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 经验记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/me/messages/read-all:
    post:
      tags: [Users]
      operationId: markAllMessagesRead
      summary: 全部消息标记已读（进入消息页后调用，红点消除）
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: 已全部标记
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/announcements:
    get:
      tags: [Admin]
      operationId: listAnnouncements
      summary: 公告历史（仅站长）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 公告列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      operationId: createAnnouncement
      summary: 发布全站公告（仅站长，广播到所有用户收件箱）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/CreateAnnouncementRequest"
      responses:
        "201":
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: 获取公开用户资料
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 用户公开资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/stats/overview:
    get:
      tags: [Admin]
      operationId: getAdminStatsOverview
      summary: 站长总览统计（用户数/浏览量/日活月活/在线人数/内容热度）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 统计总览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: 用户列表（搜索/筛选/分页，需 manage_users 开关）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          schema: { type: string }
          description: 搜索用户名/邮箱/手机号
        - name: group
          in: query
          schema: { type: string, enum: [normal, verified, premium] }
        - name: role
          in: query
          schema: { type: string, enum: [guest, member, editor, moderator, admin, owner] }
        - name: status
          in: query
          schema: { type: string, enum: [active, muted, banned, deleted] }
        - name: level
          in: query
          schema: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userId}:
    get:
      tags: [Admin]
      operationId: getAdminUser
      summary: 用户详情（需 manage_users 开关）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      operationId: updateAdminUser
      summary: 修改用户（组/等级/封禁/解禁/权限开关/角色；role 与 permissions 仅 owner 可改）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        $ref: "#/components/requestBodies/AdminUpdateUserRequest"
      responses:
        "200":
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: 登录或刷新令牌
      security: []
      requestBody:
        $ref: "#/components/requestBodies/AuthSessionRequest"
      responses:
        "200":
          description: 认证会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      operationId: deleteSession
      summary: 登出并撤销会话
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已登出
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/email-codes:
    post:
      tags: [Auth]
      operationId: sendEmailCode
      summary: 发送邮箱注册验证码（限流：同一邮箱 60s 一次、每日 5 次）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: 验证码已发送
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /wiki/categories:
    get:
      tags: [Wiki]
      operationId: listWikiCategories
      summary: 获取 Wiki 分类
      security: []
      responses:
        "200":
          description: 分类列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiCategoryList"

  /admin/wiki/categories:
    post:
      tags: [Wiki]
      operationId: createWikiCategory
      summary: 新建 Wiki 分类（管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/AdminWikiCategoryCreate"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/wiki/categories/{slug}:
    patch:
      tags: [Wiki]
      operationId: updateWikiCategory
      summary: 更新 Wiki 分类（管理员）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        $ref: "#/components/requestBodies/AdminWikiCategoryUpdate"
      responses:
        "200":
          description: 更新后的分类
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Wiki]
      operationId: deleteWikiCategory
      summary: 删除 Wiki 分类（管理员，非空返回 409）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/forum/boards:
    post:
      tags: [Forum]
      operationId: createForumBoard
      summary: 新建论坛板块（管理员）
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/AdminForumBoardCreate"
