        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Forum]
      operationId: unbookmarkThread
      summary: 取消收藏
      security: [{ bearerAuth: [] }]
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已取消
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /forum/threads/{threadId}/like:
    put:
      tags: [Forum]
      operationId: likeThread
      summary: 点赞主题（幂等）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已点赞
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Forum]
      operationId: unlikeThread
      summary: 取消点赞
      security: [{ bearerAuth: [] }]
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已取消
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /wiki/pages/{slug}/comments:
    get:
      tags: [Comments]
      operationId: listWikiComments
      summary: 获取 Wiki 页面评论
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 评论列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Comments]
      operationId: createWikiComment
      summary: 发表 Wiki 评论
      security: [{ bearerAuth: [] }]
