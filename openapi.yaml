          description: 评论成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /guides/{slug}/comments:
    get:
      tags: [Comments]
      operationId: listGuideComments
      summary: 获取攻略评论
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 评论列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Comments]
      operationId: createGuideComment
      summary: 发表攻略评论
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        $ref: "#/components/requestBodies/CreateCommentRequest"
      responses:
        "201":
          description: 评论成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /comments/{commentId}:
    patch:
      tags: [Comments]
      operationId: updateComment
      summary: 编辑评论
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: "#/components/requestBodies/CreateCommentRequest"
      responses:
        "200":
          description: 更新后的评论
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: 删除评论
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /comments/{commentId}/like:
    put:
      tags: [Comments]
      operationId: likeComment
      summary: 点赞评论
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已点赞
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Comments]
      operationId: unlikeComment
      summary: 取消点赞
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已取消
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /search:
    get:
      tags: [Search]
      operationId: search
      summary: 跨内容搜索
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: kind
          in: query
          schema:
            type: string
            enum: [all, wiki, guide, forum]
            default: all
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /uploads:
    post:
      tags: [Uploads]
      operationId: uploadFile
      summary: 上传文件
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: 文件过大
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"

  /uploads/presign:
    post:
      tags: [Uploads]
      operationId: presignUpload
      summary: 获取预签名上传地址
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/PresignUploadRequest"
      responses:
        "201":
          description: 预签名信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUpload"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  requestBodies:
    AdminWikiCategoryCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, name, sortOrder]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminWikiCategoryUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminForumBoardCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [slug, name, sortOrder]
            properties:
              slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    AdminForumBoardUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 64 }
              description: { type: string }
              sortOrder: { type: integer }
    RegisterRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, password]
            properties:
              username:
                type: string
                minLength: 2
                maxLength: 32
                pattern: "^[\\w\\-\\u4e00-\\u9fa5]+$"
              password:
                type: string
                minLength: 8
                maxLength: 128
              email:
                type: string
                format: email
                description: 邮箱注册时必填，需同时传 emailCode
              emailCode:
                type: string
                description: 邮箱注册验证码（POST /auth/email-codes 获取，6 位数字，10 分钟内有效）
              phone:
                type: string
                pattern: "^1[3-9]\\d{9}$"
                description: 中国大陆手机号注册（暂仅格式校验，短信验证接入后启用；与 email 二选一）
    AuthSessionRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [grantType]
            properties:
              grantType:
                type: string
                enum: [password, refreshToken]
              email:
                type: string
                format: email
                description: 邮箱登录（与 phone 二选一）
              phone:
                type: string
                pattern: "^1[3-9]\\d{9}$"
                description: 手机号登录（与 email 二选一）
              password:
                type: string
              refreshToken:
                type: string
    UpdateCurrentUserRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              displayName:
                type: string
                maxLength: 64
              avatarUrl:
                type: string
                format: uri
              bio:
                type: string
    CreateHistoryEntryRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, slug]
            properties:
              kind:
                type: string
                enum: [wikiPage, guide, forumThread]
              slug:
                type: string
                description: wiki/guide 的 slug；forumThread 传 threadId
    CreateDirectMessageRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [recipientId, content]
            properties:
              recipientId: { type: string, format: uuid }
              content: { type: string, maxLength: 2000 }
    CreateAnnouncementRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content]
            properties:
              title: { type: string, maxLength: 200 }
              content: { type: string, maxLength: 5000 }
    CreateVideoRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [kind, title, url]
            properties:
              kind:
                type: string
                enum: [official, analysis, gameplay]
              title: { type: string, maxLength: 200 }
              url: { type: string, format: uri }
              platform:
                type: string
                enum: [bilibili, douyin, youtube, other]
              coverImage: { type: [string, "null"], format: uri }
              description: { type: [string, "null"], maxLength: 500 }
              published: { type: boolean }
              sortOrder: { type: integer }
    UpdateSiteSectionsRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              home: { type: boolean }
              world: { type: boolean }
              wiki: { type: boolean }
              guides: { type: boolean }
              forum: { type: boolean }
              videos: { type: boolean }
    UpdateFloatingWindowsRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              left:
                $ref: "#/components/schemas/FloatingWindowConfig"
              right:
                $ref: "#/components/schemas/FloatingWindowConfig"
    UpdateVideoRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              kind:
                type: string
                enum: [official, analysis, gameplay]
              title: { type: string, maxLength: 200 }
              url: { type: string, format: uri }
              platform:
                type: string
                enum: [bilibili, douyin, youtube, other]
              coverImage: { type: [string, "null"], format: uri }
              description: { type: [string, "null"], maxLength: 500 }
              published: { type: boolean }
              sortOrder: { type: integer }
    AdminUpdateUserRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              group:
                type: string
                enum: [normal, verified, premium]
              level:
                type: integer
                minimum: 1
                maximum: 10
              status:
                type: string
                enum: [active, muted, banned]
              banReason: { type: string }
              banUntil: { type: [string, "null"], format: date-time }
              mutedUntil: { type: [string, "null"], format: date-time }
              wikiCreateGranted: { type: boolean }
              permissions:
                type: array
                items:
                  type: string
                  enum: [manage_users, manage_content, manage_forum, manage_cms, manage_deletion, grant_wiki_create]
              role:
                type: string
                enum: [member, editor, moderator, admin]
                description: 仅站长可为任意用户分配角色（成员/编辑/版主/管理员；不含 owner）
                maxLength: 500
    CreateWikiPageRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content, categorySlug]
            properties:
              title:
                type: string
                maxLength: 200
              slug:
                type: string
                pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              categorySlug:
                type: string
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              content:
                type: string
              status:
                type: string
                enum: [draft, published]
                default: draft
              changelog:
                type: string
                maxLength: 200
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    UpdateWikiPageRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              categorySlug: { type: string }
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              content: { type: string }
              status:
                type: string
                enum: [draft, published, archived]
              changelog:
                type: string
                maxLength: 200
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    CreateGuideRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content]
            properties:
              title: { type: string, maxLength: 200 }
              slug:
                type: string
                pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
              content: { type: string }
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              status:
                type: string
                enum: [draft, published]
                default: draft
              relatedCharacter:
                type: string
    UpdateGuideRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              tags:
                type: array
                items: { type: string }
                maxItems: 10
              status:
                type: string
                enum: [draft, published, archived]
              relatedCharacter: { type: string }
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    RatingInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [score]
            properties:
              score:
                type: integer
                minimum: 1
                maximum: 5
    CreateForumThreadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, content]
            properties:
              title: { type: string, maxLength: 120 }
              content: { type: string, maxLength: 20000 }
              coverImage: { type: [string, "null"], format: uri }
    UpdateForumThreadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string, maxLength: 120 }
              pinned: { type: boolean }
              locked: { type: boolean }
              coverImage: { type: [string, "null"], format: uri }
              featured: { type: boolean }
              featuredAt: { type: [string, "null"], format: date-time }
    CreateForumPostRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string, maxLength: 20000 }
    CreateCommentRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string, maxLength: 2000 }
    PresignUploadRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [filename, contentType]
            properties:
              filename: { type: string }
              contentType: { type: string }
              size:
                type: integer
                maximum: 10485760

  schemas:
    Error:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: "https://api.nodusfall.example.com/errors/validation-error"
        title:
          type: string
          example: "Validation Error"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "请求参数校验失败"
        instance:
          type: string
          format: uri
        code:
          type: string
          example: "VALIDATION_ERROR"
        requestId:
          type: string
          example: "req_01J0ABCDEF"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: "email"
        code:
          type: string
          example: "INVALID_FORMAT"
        message:
          type: string
          example: "email 必须是有效的邮箱地址"

    Pagination:
      type: object
      required: [page, perPage, total, totalPages, hasMore]
      properties:
        page:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 20
        total:
          type: integer
          example: 128
        totalPages:
          type: integer
          example: 7
        hasMore:
          type: boolean
          example: true

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: "1.0.0"
        dependencies:
          type: object
          additionalProperties:
            type: string

    SiteSections:
      type: object
      required: [home, world, wiki, guides, forum, videos]
      properties:
        home: { type: boolean }
        world: { type: boolean }
        wiki: { type: boolean }
        guides: { type: boolean }
        forum: { type: boolean }
        videos: { type: boolean }

    FloatingWindowConfig:
      type: object
      required: [enabled, imageUrl, linkUrl]
      properties:
        enabled: { type: boolean }
        imageUrl: { type: [string, "null"], format: uri }
        linkUrl: { type: [string, "null"], format: uri }

    FloatingWindows:
      type: object
      required: [left, right]
      properties:
        left: { $ref: "#/components/schemas/FloatingWindowConfig" }
        right: { $ref: "#/components/schemas/FloatingWindowConfig" }

    UserSummary:
      type: object
      required: [id, username, displayName, role, createdAt, status, group, level]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        role:
          type: string
          enum: [guest, member, editor, moderator, admin, owner]
          description: owner 为最高权限管理员（站长），admin/moderator 权限由 permissions 开关控制
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [active, muted, banned, deleted]
          description: muted 禁言（可浏览不可发言）；banned 黑名单（禁止登录访问）；deleted 已注销
        group:
          type: string
          enum: [normal, verified, premium]
          description: normal 仅阅览；verified 认证后可评论/发帖；premium 付费组（预留）
        level:
          type: integer
          minimum: 1
          maximum: 10
          description: 通用用户等级 1-10

    User:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          properties:
            bio: { type: string }
            updatedAt: { type: string, format: date-time }
            emailMasked: { type: string }
            phoneMasked: { type: [string, "null"] }
            exp:
              type: integer
              description: 累计经验（等级由经验换算）
            nextLevelExp:
              type: [integer, "null"]
              description: 升到下一级所需累计经验；满级为 null
            permissions:
              type: array
              items:
                type: string
                enum: [manage_users, manage_content, manage_forum, manage_cms, manage_deletion, grant_wiki_create]
              description: 管理员权限开关（仅 owner 可配置，默认空）
            wikiCreateGranted:
              type: boolean
              description: 是否被站长授予 Wiki 词条创建资格
            banReason: { type: [string, "null"] }
            banUntil: { type: [string, "null"], format: date-time }
            mutedUntil: { type: [string, "null"], format: date-time }

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [email, phone, lastActiveAt]
          properties:
            email: { type: string, format: email }
            phone: { type: [string, "null"] }
            lastActiveAt: { type: [string, "null"], format: date-time }

    AdminUserList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        pagination:
          $ref: "#/components/schemas/Pagination"

